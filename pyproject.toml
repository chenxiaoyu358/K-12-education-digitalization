[project]
name = "ztb-classify"
version = "1.0.0"
description = "Deterministic jieba rule engine, non-ICT pre-filter, GB/T 2260 geocoder, and SHA-256 deduplicator for K-12 education ICT procurement records (companion code to the Scientific Data Data Descriptor)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["procurement", "classification", "jieba", "geocoding", "China", "education"]
dependencies = [
    "jieba>=0.42",
    "w3lib>=2.0",
]

[project.optional-dependencies]
# Loading the deposited dataset / metadata and running the worked examples.
data = [
    "pandas>=2.0",
    "pyarrow>=14",
    "frictionless>=5",
    "mlcroissant>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ztb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
